name: Release
on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'

jobs:
  release:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate CalVer
        id: calver
        shell: pwsh
        run: |
          # Create a valid semver CalVer that respects Windows limits (Major/Minor <= 255, Patch <= 65535)
          # Format: (Year-2020).(Month).(Day * 1000 + RunNumber)
          $year = (Get-Date).Year - 2020
          $month = (Get-Date).Month
          $day = (Get-Date).Day
          $run = [int]$env:GITHUB_RUN_NUMBER
          $patch = ($day * 1000) + $run
          $version = "$year.$month.$patch"
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: setup rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: install dependencies
        run: npm install

      - name: Update version in files
        shell: pwsh
        run: |
          $version = "${{ steps.calver.outputs.version }}"
          # package.json - replace version field
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $pkg.version = $version
          $pkg | ConvertTo-Json -Depth 10 | Set-Content package.json
          # tauri.conf.json - replace version field
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $conf.version = $version
          $conf | ConvertTo-Json -Depth 10 | Set-Content src-tauri/tauri.conf.json
          # Cargo.toml - replace only the package version (first occurrence)
          $content = Get-Content src-tauri/Cargo.toml -Raw
          $content = $content -replace '(?m)^(version = ")[^"]*"', "`${1}${version}`""
          Set-Content src-tauri/Cargo.toml $content

      - name: build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v${{ steps.calver.outputs.version }}
          releaseName: 'Fadunar v${{ steps.calver.outputs.version }}'
          releaseBody: 'Automated release for commit ${{ github.sha }}'
          releaseDraft: false
          prerelease: false
          uploadPlainBinary: true
