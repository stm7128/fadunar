<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fadunar</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="panel">
      <div class="panel-header">
        <h2>設定</h2>
        <button id="btn-reset-settings" type="button" class="btn-danger-sm">設定を初期化</button>
      </div>

      <div class="form-group">
        <label for="default-folder">デフォルト保存先フォルダ</label>
        <div class="input-with-button">
          <input type="text" id="default-folder" placeholder="例: C:\Users\Username\Downloads\Organized" readonly />
          <button id="btn-select-folder" type="button">参照...</button>
        </div>
      </div>
      <div class="form-group">
        <label for="naming-template">フォルダ命名規則 (テンプレート)</label>
        <input type="text" id="naming-template" value="$AUTHOR/$TITLE" placeholder="例: $AUTHOR/$TITLE" />
        <small class="help-text">使用可能な変数: $AUTHOR, $CIRCLE, $TITLE, $ID, $DATE, $CV, $GENRE, $SERIES</small>
      </div>
      <div class="form-group form-row">
        <div class="flex-1">
          <label for="concurrency-limit">同時解凍数 (並列処理)</label>
          <input type="number" id="concurrency-limit" class="control-full" value="3" min="1" max="20" />
        </div>
        <div class="flex-1">
          <label for="duplicate-action">重複時の動作</label>
          <select id="duplicate-action" class="control-full">
            <option value="rename">連番を付けて保存</option>
            <option value="skip">スキップ</option>
          </select>
        </div>
      </div>
      <div class="form-group mt-15">
        <label class="checkbox-label">
          <input type="checkbox" id="delete-original" class="checkbox-input" />
          解凍成功後に元のZIPファイルをゴミ箱へ移動する
        </label>
        <small class="help-text help-text-indent">※解凍が完全に成功した場合のみ、元のZIPファイルを安全にゴミ箱へ移動します。</small>
      </div>

      <div class="form-group section-divider">
        <label>完了通知（デスクトップ通知）の条件</label>
        <div class="notify-row">
          <div class="notify-field">
            <input type="number" id="notify-min-files" class="input-compact" value="3" min="1" />
            <span>件以上のファイル</span>
          </div>
          <div class="flex-center">または</div>
          <div class="notify-field">
            <input type="number" id="notify-min-time" class="input-compact" value="30" min="1" />
            <span>秒以上の処理時間</span>
          </div>
        </div>
      </div>
    </div>

    <div id="drop-zone" class="panel">
      <p>ここにZIPファイルをドラッグ＆ドロップ</p>

      <div id="queue-status-container">
        <span id="queue-progress-text">0 / 0 解凍済み</span>
      </div>

      <div id="progress-bars-container"></div>
    </div>

    <div id="history-panel" class="panel">
      <details open>
        <summary class="section-summary">解凍履歴</summary>
        <div id="history-list">
          <div id="history-empty" class="empty-state">履歴はありません</div>
        </div>
      </details>
    </div>

    <div class="panel">
      <details open>
        <summary class="section-summary">タスクキュー</summary>
        <div id="task-queue" class="log-container">
          <div class="task-item empty-state">
            タスクはありません
          </div>
        </div>
      </details>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
