<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fadunar</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="panel">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h2>設定</h2>
        <button id="btn-reset-settings" style="padding: 6px 10px; font-size: 12px; font-weight: bold; cursor: pointer; background: #e74c3c; color: white; border: none; border-radius: 4px;">設定を初期化</button>
      </div>
      
      <div class="form-group">
        <label for="default-folder">デフォルト保存先フォルダ</label>
        <div class="input-with-button">
          <input type="text" id="default-folder" placeholder="例: C:\Users\Username\Downloads\Organized" readonly />
          <button id="btn-select-folder">参照...</button>
        </div>
      </div>
      <div class="form-group">
        <label for="naming-template">フォルダ命名規則 (テンプレート)</label>
        <input type="text" id="naming-template" value="$AUTHOR/$TITLE" placeholder="例: $AUTHOR/$TITLE" />
        <small style="color: var(--border-color); font-size: 12px; margin-top: 2px;">使用可能な変数: $AUTHOR, $CIRCLE, $TITLE, $ID, $DATE, $CV, $GENRE, $SERIES</small>
      </div>
      <div class="form-group" style="display: flex; gap: 10px;">
        <div style="flex: 1;">
          <label for="concurrency-limit">同時解凍数 (並列処理)</label>
          <input type="number" id="concurrency-limit" value="3" min="1" max="20" style="width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 4px; background-color: var(--bg-color); color: var(--text-color);" />
        </div>
        <div style="flex: 1;">
          <label for="duplicate-action">重複時の動作</label>
          <select id="duplicate-action" style="width: 100%; padding: 8px; border: 1px solid var(--border-color); border-radius: 4px; background-color: var(--bg-color); color: var(--text-color);">
            <option value="rename">連番を付けて保存</option>
            <option value="skip">スキップ</option>
          </select>
        </div>
      </div>
      <div class="form-group" style="margin-top: 15px;">
        <label style="display: flex; align-items: center; cursor: pointer;">
          <input type="checkbox" id="delete-original" style="margin-right: 8px; width: 16px; height: 16px;" />
          解凍成功後に元のZIPファイルをゴミ箱へ移動する
        </label>
        <small style="color: var(--border-color); font-size: 12px; margin-top: 4px; display: block; margin-left: 24px;">※解凍が完全に成功した場合のみ、元のZIPファイルを安全にゴミ箱へ移動します。</small>
      </div>

      <div class="form-group" style="margin-top: 15px; border-top: 1px solid var(--border-color); padding-top: 15px;">
        <label>完了通知（デスクトップ通知）の条件</label>
        <div style="display: flex; gap: 15px; margin-top: 8px;">
          <div style="flex: 1; display: flex; align-items: center; gap: 8px;">
            <input type="number" id="notify-min-files" value="3" min="1" style="width: 60px; padding: 4px; border: 1px solid var(--border-color); border-radius: 4px; background-color: var(--bg-color); color: var(--text-color);" />
            <span>件以上のファイル</span>
          </div>
          <div style="display: flex; align-items: center;">または</div>
          <div style="flex: 1; display: flex; align-items: center; gap: 8px;">
            <input type="number" id="notify-min-time" value="30" min="1" style="width: 60px; padding: 4px; border: 1px solid var(--border-color); border-radius: 4px; background-color: var(--bg-color); color: var(--text-color);" />
            <span>秒以上の処理時間</span>
          </div>
        </div>
      </div>
    </div>

    <div id="drop-zone" class="panel">
      <p>ここにZIPファイルをドラッグ＆ドロップ</p>
      
      <div id="queue-status-container" style="display: none; margin-top: 15px; text-align: center; font-weight: bold;">
        <span id="queue-progress-text">0 / 0 解凍済み</span>
      </div>
      
      <div id="progress-bars-container" style="display: flex; flex-direction: column; gap: 10px; margin-top: 10px;">
        <!-- 動的にプログレスバーが追加されます -->
      </div>
    </div>
    
    <div id="history-panel" class="panel" style="margin-top: 20px;">
      <details open>
        <summary style="font-size: 1.5em; font-weight: bold; cursor: pointer; user-select: none;">解凍履歴</summary>
        <div id="history-list" style="display: flex; flex-direction: column; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border-color); max-height: 200px; overflow-y: auto;">
          <div id="history-empty" style="color: var(--border-color); font-size: 13px; text-align: center; padding: 10px;">履歴はありません</div>
        </div>
      </details>
    </div>

    <div class="panel">
      <details open>
        <summary style="font-size: 1.5em; font-weight: bold; cursor: pointer; user-select: none;">タスクキュー</summary>
        <div id="task-queue" class="log-container" style="margin-top: 10px;">
          <div class="task-item" style="color: var(--border-color); font-size: 13px; text-align: center; padding: 10px;">
            タスクはありません
          </div>
        </div>
      </details>
    </div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
